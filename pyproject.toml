[tool.poetry]
name = "onesigma"
version = "0.1.0"
description = "ERP Industrial para esquadrias de alumínio"
authors = ["Carlos Alberto de Sena <carlos@onesigma.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = "^0.34.0"
sqlalchemy = "^2.0.0"
alembic = "^1.14.0"
pydantic = "^2.10.0"
celery = "^5.4.0"
redis = "^5.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
black = "^24.10.0"
flake8 = "^7.1.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
